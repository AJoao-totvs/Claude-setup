# Exemplo mínimo de spec YAML para a skill cnab-protheus.
# Para um exemplo real e completo, veja references/specs/bb/pagamento.yaml.

banco: "001"
operacao: "pagamento"
direcao: "remessa"

declaracoes:
  - register: "10"
    subtype: "H"
    name: "Header de Arquivo"
    condition: ".T."

campos:
  - register: "20"
    subtype: "H"
    name: "CODIGO DO BANCO"
    start: 1
    end: 3
    flag: "0"
    pattern: "literal_constant"
    args:
      value: "001"

  - register: "20"
    subtype: "H"
    name: "NUM. CONTA"
    start: 59
    end: 70
    flag: "0"
    pattern: "alpha_padl_zeros"
    args:
      src: "SEE->EE_CONTA"
      length: 12
